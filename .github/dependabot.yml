version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    # 版本更新先暂停，等 v0.1.0 基线稳定后再打开；安全更新不受此限制
    open-pull-requests-limit: 0
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # 版本更新先暂停，等 v0.1.0 基线稳定后再打开；安全更新不受此限制
    open-pull-requests-limit: 0
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /backend/runner
    schedule:
      interval: weekly
    # 版本更新先暂停，等 v0.1.0 基线稳定后再打开；安全更新不受此限制
    open-pull-requests-limit: 0
    groups:
      runner-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 版本更新先暂停，等 v0.1.0 基线稳定后再打开；安全更新不受此限制
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
